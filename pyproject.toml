[project]
name = "originplot-skill"
version = "0.1.0"
description = "A Codex skill for automating Origin/OriginPro figures from external Python"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Xiaoou", email = "xiaoou@example.com"}
]
keywords = ["originpro", "origin", "plotting", "scientific", "codex", "skill"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
dev = ["pyyaml", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
